<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zapien Chat Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: transparent;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-widget {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: white;
            border-radius: 0;
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            color: white;
            flex-shrink: 0;
            background: var(--primary-color, #667eea);
        }

        .avatar-container {
            width: 40px;
            height: 40px;
            background: #1a1a1a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .header-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .header-name {
            font-weight: 600;
            font-size: 14px;
            letter-spacing: -0.3px;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            opacity: 0.95;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #4CAF50;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f5f5f5;
        }

        .message {
            display: flex;
            gap: 8px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.bot .message-content {
            background: #ffffff;
            color: #1a1a1a;
            border: 1px solid #e0e0e0;
        }

        .message.user .message-content {
            background: var(--primary-color, #667eea);
            color: white;
        }

        .chat-input-area {
            padding: 14px 16px;
            border-top: 1px solid #e8e8e8;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            background: white;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d0d0d0;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-family: inherit;
        }

        .chat-input-area input:focus {
            border-color: var(--primary-color, #667eea);
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        .chat-input-area button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: transform 0.2s, opacity 0.2s;
            flex-shrink: 0;
            background: var(--primary-color, #667eea);
            color: white;
        }

        .chat-input-area button:hover {
            transform: scale(1.08);
        }

        .chat-input-area button:active {
            transform: scale(0.95);
        }

        .chat-input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
    </style>
</head>
<body>
    <div class="chat-widget" id="chatWidgetRoot">
        <div class="chat-header" id="chatHeader">
            <div class="avatar-container" id="avatarContainer"></div>
            <div class="header-info">
                <div class="header-name" id="headerName"></div>
                <div class="header-status">
                    <span class="status-dot"></span>
                    <span>EN VIVO</span>
                </div>
            </div>
            <button id="headerCloseBtn" aria-label="Cerrar chat" style="background:transparent;border:none;color:white;font-size:18px;cursor:pointer;">✕</button>
        </div>

        <div class="chat-messages" id="messages">
            <div class="message bot">
                <div class="message-content">
                    ¡Hola! 👋 ¿En qué te puedo ayudar?
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <input
                type="text"
                id="messageInput"
                placeholder="Escribe un mensaje..."
                autocomplete="off"
            >
            <button id="sendBtn" onclick="sendMessage()">📤</button>
        </div>
    </div>

    <!-- Minimized floating button (for iframe internal toggle) -->
    <button id="minimizedButton" aria-label="Abrir chat" style="position:fixed;bottom:16px;right:16px;width:56px;height:56px;border-radius:50%;border:none;background:var(--primary-color,#667eea);color:white;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 18px rgba(0,0,0,0.16);z-index:1000;">💬</button>

    <script>
        // Get URL parameters
        const params = new URLSearchParams(window.location.search);
        const botId = params.get('botId');
        const embedKey = params.get('embedKey');
        const urlColor = params.get('color');
        const urlAvatar = params.get('avatar');
        const urlName = params.get('name');

        // Initial values
        let apiUrl = 'http://localhost:5001';
        let conversationId = Date.now().toString();
        let visitorId = 'visitor-' + Math.random().toString(36).substr(2, 9);
        let primaryColor = urlColor || '#667eea';
        let avatar = urlAvatar || '🤖';
        let chatbotName = urlName || 'Zapien Chat';

        // Apply theme
        function applyTheme() {
            // Set CSS variable for primary color (used in header, button, and user messages)
            document.documentElement.style.setProperty('--primary-color', primaryColor);

            // Set avatar emoji
            document.getElementById('avatarContainer').textContent = avatar;

            // Set bot name
            document.getElementById('headerName').textContent = chatbotName;
        }

        // Apply theme on load
        applyTheme();
        // Initially hide full widget and show minimized button (iframe consumer may resize)
        document.getElementById('chatWidgetRoot').style.display = 'none';
        document.getElementById('minimizedButton').style.display = 'flex';

        // Click on minimized button -> request parent to open and show widget
        document.getElementById('minimizedButton').addEventListener('click', function() {
            window.parent.postMessage({ type: 'zapien-open-request' }, '*');
            // Also reveal internal UI
            document.getElementById('chatWidgetRoot').style.display = 'flex';
            document.getElementById('minimizedButton').style.display = 'none';
            // Start conversation when opened
            if (typeof startConversation === 'function') startConversation();
        });

        // Close button inside header -> request parent to collapse
        const closeBtn = document.getElementById('headerCloseBtn');
        if (closeBtn) {
            closeBtn.addEventListener('click', function() {
                window.parent.postMessage({ type: 'zapien-close-request' }, '*');
                document.getElementById('chatWidgetRoot').style.display = 'none';
                document.getElementById('minimizedButton').style.display = 'flex';
            });
        }

        // Start conversation helper: create conversation on backend and set ids
        async function startConversation() {
            try {
                const res = await fetch(apiUrl + '/api/embed/conversations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ embedKey, visitorId })
                });
                const data = await res.json();
                if (data.success && data.data) {
                    conversationId = data.data.conversationId;
                    // botId returned from server (override URL param if any)
                    // keep botId var in scope
                    botId = data.data.botId || botId;

                    // Use welcome message from server when available
                    const welcome = data.data.welcomeMessage || '¡Hola! ¿En qué te puedo ayudar?';
                    const messagesDiv = document.getElementById('messages');
                    messagesDiv.innerHTML = `<div class="message bot"><div class="message-content">${escapeHtml(welcome)}</div></div>`;
                } else {
                    console.warn('Start conversation failed', data);
                }
            } catch (err) {
                console.error('Error starting conversation:', err);
            }
        }

        // Listen for initialization message from parent
        window.addEventListener('message', function(event) {
            if (!event.data) return;
            if (event.data.type === 'zapien-init') {
                apiUrl = event.data.apiUrl || apiUrl;

                // Update theme from parent if provided
                if (event.data.color) {
                    primaryColor = event.data.color;
                    applyTheme();
                }
                if (event.data.avatar) {
                    avatar = event.data.avatar;
                    applyTheme();
                }
                if (event.data.chatbotName) {
                    chatbotName = event.data.chatbotName;
                    applyTheme();
                }

                // If embed provided a conversationId use it, otherwise start one
                if (event.data.conversationId) {
                    conversationId = event.data.conversationId;
                } else {
                    // create conversation on server
                    startConversation();
                }
            }
        });

        // Notify parent that iframe is ready
        window.parent.postMessage({
            type: 'zapien-chat-ready'
        }, '*');

        // Listen for parent commands to close (collapse) the widget
        window.addEventListener('message', function(event) {
            if (!event.data) return;
            if (event.data.type === 'zapien-close') {
                document.getElementById('chatWidgetRoot').style.display = 'none';
                document.getElementById('minimizedButton').style.display = 'flex';
            }
        });

        // Setup input field
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            const messagesDiv = document.getElementById('messages');

            // Add user message with primary color
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerHTML = `<div class="message-content" style="background: ${primaryColor}; color: white;">${escapeHtml(message)}</div>`;
            messagesDiv.appendChild(userMsg);

            input.value = '';
            input.disabled = true;
            document.getElementById('sendBtn').disabled = true;

            // Auto-scroll
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                // Send message to backend
                const response = await fetch(apiUrl + '/api/embed/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        conversationId,
                        botId,
                        content: message,
                        visitorId,
                        embedKey
                    })
                });

                const data = await response.json();

                if (data.success && data.data?.botMessage) {
                    // Add bot response
                    const botMsg = document.createElement('div');
                    botMsg.className = 'message bot';
                    botMsg.innerHTML = `<div class="message-content">${escapeHtml(data.data.botMessage.content)}</div>`;
                    messagesDiv.appendChild(botMsg);
                } else {
                    // Demo response or error from backend
                    const errorText = (data?.message) ? data.message : 'Gracias por tu mensaje. Configura OpenAI para respuestas automáticas.';
                    const botMsg = document.createElement('div');
                    botMsg.className = 'message bot';
                    botMsg.innerHTML = `<div class="message-content">${escapeHtml(errorText)}</div>`;
                    messagesDiv.appendChild(botMsg);
                }
            } catch (error) {
                console.error('Error:', error);

                const errorMsg = document.createElement('div');
                errorMsg.className = 'message bot';
                errorMsg.innerHTML = `<div class="message-content">⚠️ Error al procesar tu mensaje. Intenta de nuevo.</div>`;
                messagesDiv.appendChild(errorMsg);
            } finally {
                input.disabled = false;
                document.getElementById('sendBtn').disabled = false;
                input.focus();
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
