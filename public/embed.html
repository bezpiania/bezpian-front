<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bezpian Chat Widget</title>
    <style>
        html, body {
            background: transparent !important;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: transparent;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Standalone mode: body gets a backdrop */
        body.standalone-mode {
            background: rgba(0, 0, 0, 0.15);
        }

        .chat-widget {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background: white;
        }

        /* Popup mode: fixed 500px chat, button sits below in remaining 80px */
        #chatWidgetRoot {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 500px;
            z-index: 999;
            border-radius: 16px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.22), 0 4px 16px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            color: white;
            flex-shrink: 0;
            background: var(--primary-color, #667eea);
        }

        .avatar-container {
            width: 40px;
            height: 40px;
            background: #1a1a1a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .header-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .header-name {
            font-weight: 600;
            font-size: 14px;
            letter-spacing: -0.3px;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            opacity: 0.95;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #4CAF50;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f5f5f5;
        }

        .message {
            display: flex;
            gap: 8px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.bot .message-content {
            background: #ffffff;
            color: #1a1a1a;
            border: 1px solid #e0e0e0;
        }

        .message.user .message-content {
            background: var(--primary-color, #667eea);
            color: var(--text-color, white);
        }

        .typing-bubble {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 10px 14px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 4px 16px 16px 16px;
            width: fit-content;
        }
        .typing-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #bbb;
            animation: tdot 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: .2s }
        .typing-dot:nth-child(3) { animation-delay: .4s }
        @keyframes tdot {
            0%, 60%, 100% { opacity: .25; transform: scale(1) }
            30%            { opacity: .8;  transform: scale(1.3) }
        }

        .chat-input-area {
            padding: 14px 16px;
            border-top: 1px solid #e8e8e8;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            background: white;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d0d0d0;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            font-family: inherit;
        }

        .chat-input-area input:focus {
            border-color: var(--primary-color, #667eea);
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        .chat-input-area button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: transform 0.2s, opacity 0.2s;
            flex-shrink: 0;
            background: var(--primary-color, #667eea);
            color: white;
        }

        .chat-input-area button:hover {
            transform: scale(1.08);
        }

        .chat-input-area button:active {
            transform: scale(0.95);
        }

        .chat-input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
    </style>
</head>
<body>
    <div class="chat-widget" id="chatWidgetRoot">
        <div class="chat-header" id="chatHeader">
            <div class="avatar-container" id="avatarContainer"></div>
            <div class="header-info">
                <div class="header-name" id="headerName"></div>
                <div class="header-status">
                    <span class="status-dot"></span>
                    <span>EN VIVO</span>
                </div>
            </div>
            <button id="headerCloseBtn" aria-label="Cerrar chat" style="background:transparent;border:none;color:white;font-size:18px;cursor:pointer;">✕</button>
        </div>

        <div class="chat-messages" id="messages">
            <div class="message bot" id="welcomeMsg">
                <div class="message-content" style="opacity:0.5;font-style:italic;font-size:12px;">Conectando...</div>
            </div>
        </div>

        <div class="chat-input-area">
            <input
                type="text"
                id="messageInput"
                placeholder="Escribe un mensaje..."
                autocomplete="off"
            >
            <button id="sendBtn" onclick="sendMessage()">📤</button>
        </div>
    </div>

    <!-- Minimized floating button (for iframe internal toggle) -->
    <button id="minimizedButton" aria-label="Toggle chat" style="position:fixed;bottom:0;right:0;width:64px;height:64px;border-radius:50%;border:none;background:var(--primary-color,#667eea);color:var(--text-color,white);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,0.16);z-index:2000;line-height:0.8;padding:0;cursor:pointer;text-align:center;font-weight:normal;">💬</button>

    <script>
        // Función para calcular contraste de color
        function getContrastColor(hexColor) {
            // Convertir hex a RGB
            const hex = hexColor.replace('#', '');
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);

            // Calcular luminancia relativa (fórmula WCAG)
            const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;

            // Si es claro (luminancia > 0.5), usar texto negro; si es oscuro, usar blanco
            return luminance > 0.5 ? '#000000' : '#ffffff';
        }

        // Get URL parameters
        const params = new URLSearchParams(window.location.search);
        let botId = params.get('botId');
        const embedKey = params.get('embedKey');
        const urlColor = params.get('color');
        const urlAvatar = params.get('avatar');
        const urlName = params.get('name');

        // Initial values
        let apiUrl = 'http://localhost:5001';
        let conversationId = null;
        let visitorId = 'visitor-' + Math.random().toString(36).substr(2, 9);
        let primaryColor = urlColor || '#667eea';
        let textColor = getContrastColor(primaryColor);
        let avatar = urlAvatar || '🤖';
        let chatbotName = urlName || 'Bezpian Chat';
        let additionalInfo = []; // Almacenar información adicional del usuario
        let visitorContext = {}; // Contexto del usuario (isLoggedIn, role, etc.)

        // Apply theme
        function applyTheme() {
            // Recalcular color de texto basado en el color principal
            textColor = getContrastColor(primaryColor);

            // Set CSS variables for primary color and text color
            document.documentElement.style.setProperty('--primary-color', primaryColor);
            document.documentElement.style.setProperty('--text-color', textColor);

            // Actualizar header con contraste correcto
            const header = document.getElementById('chatHeader');
            header.style.background = primaryColor;
            header.style.color = textColor;

            // Actualizar estado dot color si es necesario
            const statusSpan = document.querySelector('.header-status');
            if (statusSpan) {
                statusSpan.style.color = textColor;
            }

            // Set avatar emoji
            document.getElementById('avatarContainer').textContent = avatar;

            // Set bot name
            document.getElementById('headerName').textContent = chatbotName;
            document.getElementById('headerName').style.color = textColor;

            // Actualizar botón de cerrar
            const closeBtn = document.getElementById('headerCloseBtn');
            if (closeBtn) {
                closeBtn.style.color = textColor;
            }
        }

        // Apply theme on load
        applyTheme();

        // Detect standalone BEFORE hiding
        const isStandalone = window.self === window.top;
        // Always start with widget hidden and button visible
        document.getElementById('chatWidgetRoot').style.display = 'none';
        document.getElementById('minimizedButton').style.display = 'flex';

        if (isStandalone && botId && embedKey) {
            // Standalone: apply popup style and preload bot config
            document.body.classList.add('standalone-mode');
            fetch(apiUrl + '/api/embed/bot-info?botId=' + botId + '&embedKey=' + embedKey)
                .then(r => r.json())
                .then(res => {
                    if (res.success && res.data) {
                        const info = res.data;
                        if (info.widget?.color) { primaryColor = info.widget.color; textColor = getContrastColor(primaryColor); }
                        if (info.widget?.avatar) { avatar = info.widget.avatar; }
                        if (info.name)           { chatbotName = info.name; }
                        applyTheme();
                        // Update button emoji with bot avatar
                        document.getElementById('minimizedButton').textContent = info.widget?.avatar || '💬';
                    }
                })
                .catch(() => {});
        }

        // Toggle chat open/closed — button always stays visible
        let conversationStarted = false;
        function openChat() {
            document.getElementById('chatWidgetRoot').style.display = 'flex';
            window.parent.postMessage({ type: 'zapien-open-request' }, '*');
            if (!conversationStarted) {
                conversationStarted = true;
                startConversation();
            }
        }
        function closeChat() {
            document.getElementById('chatWidgetRoot').style.display = 'none';
            window.parent.postMessage({ type: 'zapien-close-request' }, '*');
        }

        document.getElementById('minimizedButton').addEventListener('click', function() {
            const isOpen = document.getElementById('chatWidgetRoot').style.display === 'flex';
            if (isOpen) { closeChat(); } else { openChat(); }
        });

        // Close button inside header
        const closeBtn = document.getElementById('headerCloseBtn');
        if (closeBtn) {
            closeBtn.addEventListener('click', closeChat);
        }

        // Start conversation helper: create conversation on backend and set ids
        async function startConversation() {
            try {
                const res = await fetch(apiUrl + '/api/embed/conversations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chatbotId: botId, embedKey, visitorId })
                });
                const data = await res.json();
                if (data.success && data.data) {
                    conversationId = data.data.conversationId;
                    // botId returned from server (override URL param if any)
                    // keep botId var in scope
                    botId = data.data.botId || botId;

                    // Use welcome message from server when available
                    const welcome = data.data.welcomeMessage || '¡Hola! ¿En qué te puedo ayudar?';
                    const messagesDiv = document.getElementById('messages');
                    messagesDiv.innerHTML = `<div class="message bot"><div class="message-content">${escapeHtml(welcome)}</div></div>`;
                } else {
                    console.warn('Start conversation failed', data);
                }
            } catch (err) {
                console.error('Error starting conversation:', err);
            }
        }

        // Listen for initialization message from parent
        window.addEventListener('message', function(event) {
            if (!event.data) return;
            if (event.data.type === 'zapien-init') {
                apiUrl = event.data.apiUrl || apiUrl;

                // Update theme from parent if provided
                if (event.data.color) {
                    primaryColor = event.data.color;
                    textColor = getContrastColor(primaryColor);
                    applyTheme();
                }
                if (event.data.avatar) {
                    avatar = event.data.avatar;
                    applyTheme();
                    document.getElementById('minimizedButton').textContent = event.data.avatar;
                }
                if (event.data.chatbotName) {
                    chatbotName = event.data.chatbotName;
                    applyTheme();
                }

                // Guardar información adicional si viene desde el parent
                if (event.data.additionalInfo && Array.isArray(event.data.additionalInfo)) {
                    additionalInfo = event.data.additionalInfo;
                }

                if (event.data.visitorContext && typeof event.data.visitorContext === 'object') {
                    visitorContext = event.data.visitorContext;
                }

                // If embed provided a conversationId use it
                if (event.data.conversationId) {
                    conversationId = event.data.conversationId;
                }
                // Otherwise conversation is created lazily on first message
            }
        });

        // Notify parent that iframe is ready
        window.parent.postMessage({
            type: 'zapien-chat-ready'
        }, '*');

        // Listen for parent commands to close (collapse) the widget
        // NOTE: do NOT call closeChat() here — that would postMessage back to parent causing an infinite loop
        window.addEventListener('message', function(event) {
            if (!event.data) return;
            if (event.data.type === 'zapien-close') {
                document.getElementById('chatWidgetRoot').style.display = 'none';
            }
        });

        // Setup input field
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            // Lazy conversation creation: ensure we have a real conversationId before sending
            if (!conversationId) {
                await startConversation();
                if (!conversationId) return; // failed to create conversation
            }

            const messagesDiv = document.getElementById('messages');

            // Add user message with primary color
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerHTML = `<div class="message-content" style="background: ${primaryColor}; color: ${textColor};">${escapeHtml(message)}</div>`;
            messagesDiv.appendChild(userMsg);

            input.value = '';
            input.disabled = true;
            document.getElementById('sendBtn').disabled = true;

            // Show typing indicator
            showTyping(messagesDiv);

            // Auto-scroll
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                // Send message to backend
                const response = await fetch(apiUrl + '/api/embed/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        conversationId,
                        botId,
                        content: message,
                        visitorId,
                        embedKey,
                        additionalInfo: additionalInfo.filter(p => p.question && p.answer),
                        visitorContext
                    })
                });

                const data = await response.json();

                hideTyping();
                if (data.success && data.data?.botMessage) {
                    // Add bot response
                    const botMsg = document.createElement('div');
                    botMsg.className = 'message bot';
                    botMsg.innerHTML = `<div class="message-content">${escapeHtml(data.data.botMessage.content)}</div>`;
                    messagesDiv.appendChild(botMsg);
                } else {
                    // Demo response or error from backend
                    const errorText = (data?.message) ? data.message : 'Gracias por tu mensaje. Configura OpenAI para respuestas automáticas.';
                    const botMsg = document.createElement('div');
                    botMsg.className = 'message bot';
                    botMsg.innerHTML = `<div class="message-content">${escapeHtml(errorText)}</div>`;
                    messagesDiv.appendChild(botMsg);
                }
            } catch (error) {
                console.error('Error:', error);
                hideTyping();
                const errorMsg = document.createElement('div');
                errorMsg.className = 'message bot';
                errorMsg.innerHTML = `<div class="message-content">⚠️ Error al procesar tu mensaje. Intenta de nuevo.</div>`;
                messagesDiv.appendChild(errorMsg);
            } finally {
                input.disabled = false;
                document.getElementById('sendBtn').disabled = false;
                input.focus();
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        }

        let typingEl = null;
        function showTyping(messagesDiv) {
            const row = document.createElement('div');
            row.className = 'message bot';
            row.innerHTML = '<div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
            typingEl = row;
            messagesDiv.appendChild(row);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        function hideTyping() {
            if (typingEl) { typingEl.remove(); typingEl = null; }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
