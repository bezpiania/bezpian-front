<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imfluid</title>
  <style>
    #zapien-iframe {
      position: fixed;
      bottom: 100px;
      right: 20px;
      width: 400px;
      height: 520px;
      border: none;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      z-index: 99998;
      transform: scale(0.8) translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: transform 220ms ease, opacity 220ms ease;
    }
    #zapien-iframe.open {
      transform: scale(1) translateY(0);
      opacity: 1;
      pointer-events: all;
    }
    #zapien-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background: #FF6B00;
      color: white;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.22);
      z-index: 99999;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    #zapien-btn:hover { transform: scale(1.08); }
  </style>
</head>
<body>
  <iframe id="zapien-iframe"
    src="https://bezpian.onrender.com/embed.html?botId=6a2607ecabefeda939011775&embedKey=56af96f363403b0726dbeb66e20f2e34&color=%23FF6B00&avatar=%F0%9F%94%A7&name=Imfluid"
    allowtransparency="true">
  </iframe>

  <button id="zapien-btn">🔧</button>

  <script>
    (function() {
      var chatbotId = '6a2607ecabefeda939011775';
      var embedKey  = '56af96f363403b0726dbeb66e20f2e34';
      var apiUrl    = 'https://bezpian-backend.onrender.com';
      var color     = '#FF6B00';
      var avatar    = '🔧';
      var name      = 'Imfluid';
      var isOpen    = false;
      var initiated = false;

      var iframe = document.getElementById('zapien-iframe');
      var btn    = document.getElementById('zapien-btn');

      btn.onclick = function() {
        isOpen = !isOpen;
        if (isOpen) {
          iframe.classList.add('open');
          if (!initiated) {
            initiated = true;
            iframe.contentWindow.postMessage({ type:'zapien-init', chatbotId:chatbotId, embedKey:embedKey, apiUrl:apiUrl, color:color, avatar:avatar, chatbotName:name }, '*');
          }
          iframe.contentWindow.postMessage({ type:'zapien-open' }, '*');
        } else {
          iframe.classList.remove('open');
          iframe.contentWindow.postMessage({ type:'zapien-close' }, '*');
        }
      };

      window.addEventListener('message', function(e) {
        if (e.data.type === 'zapien-chat-ready') {
          iframe.contentWindow.postMessage({ type:'zapien-init', chatbotId:chatbotId, embedKey:embedKey, apiUrl:apiUrl, color:color, avatar:avatar, chatbotName:name }, '*');
        }
        if (e.data.type === 'zapien-close-request') {
          isOpen = false;
          iframe.classList.remove('open');
        }
      });
    })();
  </script>
</body>
</html>
