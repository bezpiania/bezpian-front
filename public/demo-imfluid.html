<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imfluid</title>
</head>
<body>
  <script>
    (function() {
      var chatbotId = '6a2607ecabefeda939011775';
      var embedKey  = '56af96f363403b0726dbeb66e20f2e34';
      var apiUrl    = 'https://bezpian-backend.onrender.com';
      var baseUrl   = 'https://bezpian.onrender.com';
      var color     = '#FF6B00';
      var avatar    = '🔧';
      var name      = 'Imfluid';
      var isOpen    = false;

      // ── Iframe (solo el chat, sin botón) ──────────────────────────────
      var iframe = document.createElement('iframe');
      iframe.src = baseUrl + '/embed.html?botId=' + chatbotId + '&embedKey=' + embedKey
                 + '&color=' + encodeURIComponent(color)
                 + '&avatar=' + encodeURIComponent(avatar)
                 + '&name='  + encodeURIComponent(name);
      iframe.setAttribute('allowtransparency', 'true');
      iframe.style.cssText = 'display:none;position:fixed;bottom:90px;right:20px;width:400px;height:500px;border:none;border-radius:16px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.18);z-index:99998;';
      iframe.id = 'zapien-iframe';
      document.body.appendChild(iframe);

      // ── Botón flotante (fuera del iframe, siempre visible) ────────────
      var btn = document.createElement('button');
      btn.id = 'zapien-btn';
      btn.textContent = avatar;
      btn.style.cssText = 'position:fixed;bottom:20px;right:20px;width:64px;height:64px;border-radius:50%;border:none;background:' + color + ';color:white;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,0.22);z-index:99999;cursor:pointer;transition:transform 0.15s ease;';
      btn.onmouseover = function() { btn.style.transform = 'scale(1.08)'; };
      btn.onmouseout  = function() { btn.style.transform = 'scale(1)'; };
      btn.onclick = function() {
        isOpen = !isOpen;
        if (isOpen) {
          iframe.style.display = 'block';
          iframe.contentWindow.postMessage({ type:'zapien-init', chatbotId:chatbotId, embedKey:embedKey, apiUrl:apiUrl, color:color, avatar:avatar, chatbotName:name }, '*');
        } else {
          iframe.style.display = 'none';
        }
      };
      document.body.appendChild(btn);

      // ── Mensajes del iframe ───────────────────────────────────────────
      window.addEventListener('message', function(e) {
        if (e.data.type === 'zapien-chat-ready') {
          iframe.contentWindow.postMessage({ type:'zapien-init', chatbotId:chatbotId, embedKey:embedKey, apiUrl:apiUrl, color:color, avatar:avatar, chatbotName:name }, '*');
        }
        if (e.data.type === 'zapien-close-request') {
          isOpen = false;
          iframe.style.display = 'none';
        }
      });
    })();
  </script>
</body>
</html>
