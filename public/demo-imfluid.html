<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imfluid</title>
</head>
<body>
  <script>
    (function() {
      var chatbotId = '6a2607ecabefeda939011775';
      var embedKey  = '56af96f363403b0726dbeb66e20f2e34';
      var apiUrl    = 'https://bezpian-backend.onrender.com';
      var baseUrl   = 'https://bezpian.onrender.com';
      var color     = '#FF6B00';
      var avatar    = '🔧';
      var name      = 'Imfluid';

      var iframe = document.createElement('iframe');
      iframe.src = baseUrl + '/embed.html?botId=' + chatbotId + '&embedKey=' + embedKey
                 + '&color=' + encodeURIComponent(color)
                 + '&avatar=' + encodeURIComponent(avatar)
                 + '&name='  + encodeURIComponent(name);
      iframe.style.cssText = 'position:fixed;bottom:20px;right:20px;width:64px;height:64px;border:none;border-radius:999px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,0.16);z-index:99999;transition:width 240ms ease,height 240ms ease,border-radius 240ms ease;background:transparent;';
      iframe.setAttribute('allowtransparency', 'true');
      iframe.id = 'zapien-iframe';
      document.body.appendChild(iframe);

      window.addEventListener('message', function(e) {
        if (e.data.type === 'zapien-chat-ready') {
          iframe.contentWindow.postMessage({ type:'zapien-init', chatbotId:chatbotId, embedKey:embedKey, apiUrl:apiUrl, color:color, avatar:avatar, chatbotName:name }, '*');
        }
        if (e.data.type === 'zapien-open-request') {
          iframe.style.width         = '400px';
          iframe.style.height        = '580px';
          iframe.style.borderRadius  = '16px';
        }
        if (e.data.type === 'zapien-close-request') {
          iframe.style.width         = '64px';
          iframe.style.height        = '64px';
          iframe.style.borderRadius  = '999px';
          iframe.contentWindow.postMessage({type:'zapien-close'},'*');
        }
      });
    })();
  </script>
</body>
</html>
