<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Display:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #6366f1;
      --bg-dark: #0d0d0d;
      --bg-card: #1a1a1a;
      --bg-input: #1e1e1e;
      --border: rgba(255,255,255,0.08);
      --text: #e8eaed;
      --text-muted: rgba(232,234,237,0.5);
      --font: 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body { height: 100%; overflow: hidden; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg-dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Welcome screen ──────────────────────────── */
    #welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px 20px;
      gap: 28px;
      transition: opacity .35s ease, transform .35s ease;
      overflow-y: auto;
    }

    #welcome.hidden {
      display: none;
    }

    .welcome-avatar-wrap {
      position: relative;
      width: 76px; height: 76px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .welcome-avatar-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: conic-gradient(from 0deg, #4285f4, #ea4335, #fbbc05, #34a853, #4285f4);
      animation: spin 4s linear infinite;
      z-index: 0;
    }

    .welcome-avatar {
      width: 70px; height: 70px;
      border-radius: 22px;
      display: grid; place-items: center;
      font-size: 36px;
      position: relative;
      z-index: 1;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .welcome-title {
      font-family: 'Google Sans Display', var(--font);
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 500;
      text-align: center;
      letter-spacing: -.5px;
      line-height: 1.2;
      background: linear-gradient(135deg, #e8eaed 0%, rgba(232,234,237,.6) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      width: 100%;
      max-width: 640px;
    }

    .suggestions-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      width: 100%;
      max-width: 600px;
      justify-content: center;
      align-items: stretch;
    }

    .suggestion-card {
      flex: 0 0 calc(50% - 5px);
      max-width: calc(50% - 5px);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      cursor: pointer;
      transition: background .2s, border-color .2s, transform .15s;
      text-align: left;
    }

    .suggestion-card:hover {
      background: #242424;
      border-color: rgba(255,255,255,0.15);
      transform: translateY(-1px);
    }

    .suggestion-card .icon {
      font-size: 20px;
      margin-bottom: 8px;
      display: block;
    }

    .suggestion-card .text {
      font-size: 13px;
      color: var(--text);
      line-height: 1.4;
      font-weight: 400;
    }

    /* ── Chat screen ─────────────────────────────── */
    #chat-screen {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    #chat-screen.visible {
      display: flex;
    }

    #chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #chat-header .bot-chip {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 20px; padding: 6px 14px 6px 8px;
      font-size: 13px; font-weight: 500;
    }

    #chat-header .bot-chip .avatar {
      width: 24px; height: 24px; border-radius: 8px;
      display: grid; place-items: center; font-size: 14px;
    }

    #chat-header .online {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-muted);
      display: flex; align-items: center; gap: 5px;
    }

    #chat-header .online span {
      width: 6px; height: 6px; border-radius: 50%;
      background: #34a853; display: inline-block;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .msg-row { display: flex; gap: 12px; max-width: 800px; margin: 0 auto; width: 100%; }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.bot  { justify-content: flex-start; align-items: flex-start; }

    .msg-icon {
      width: 32px; height: 32px; border-radius: 50%;
      display: grid; place-items: center; font-size: 15px;
      flex-shrink: 0; margin-top: 2px;
    }

    .bubble {
      padding: 12px 18px;
      font-size: 15px; line-height: 1.65;
      word-break: break-word; white-space: pre-wrap;
      max-width: 75%;
    }

    .bubble.user {
      background: #1e3a5f;
      border-radius: 20px 4px 20px 20px;
      color: #e8eaed;
    }

    .bubble.bot {
      background: transparent;
      color: var(--text);
      border-radius: 4px 20px 20px 20px;
      padding-left: 0;
    }

    /* Typing indicator */
    .typing-row { display: flex; align-items: center; gap: 12px; max-width: 800px; margin: 0 auto; width: 100%; }
    .typing-dots { display: flex; gap: 5px; padding: 8px 0; }
    .typing-dots span {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(232,234,237,0.3);
      animation: pulse 1.4s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes pulse {
      0%,60%,100% { opacity: .3; transform: scale(1); }
      30% { opacity: 1; transform: scale(1.2); }
    }

    /* ── Input area (shared) ─────────────────────── */
    #input-container {
      flex-shrink: 0;
      padding: 12px 24px 28px;
      background: linear-gradient(to top, var(--bg-dark) 85%, transparent);
    }

    #input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 10px 10px 10px 20px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      transition: border-color .2s, box-shadow .2s;
    }

    #input-wrap:focus-within {
      border-color: rgba(255,255,255,0.2);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
    }

    #msg-input {
      flex: 1; border: none; background: transparent; resize: none;
      font-size: 15px; font-family: var(--font); line-height: 1.5;
      outline: none; max-height: 160px; overflow-y: auto;
      color: var(--text);
      caret-color: #4285f4;
      caret-shape: bar;
      padding: 6px 0;
    }

    @keyframes blink-caret {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    #msg-input::placeholder { color: var(--text-muted); }

    #send-btn {
      width: 40px; height: 40px; border-radius: 50%; border: none;
      display: grid; place-items: center; cursor: pointer;
      background: rgba(255,255,255,0.06);
      color: var(--text-muted);
      transition: all .2s; flex-shrink: 0;
    }

    #send-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 12px rgba(99,102,241,.4);
    }

    #send-btn:disabled { cursor: not-allowed; }

    .input-hint {
      text-align: center;
      margin-top: 10px;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── Mobile ──────────────────────────────────── */
    @media (max-width: 600px) {
      .suggestions-grid { grid-template-columns: 1fr; }
      .welcome-title { font-size: 26px; }
      #messages { padding: 16px; }
      #input-container { padding: 12px 16px 20px; }
    }
  </style>
</head>
<body>

<!-- ── Welcome screen ─────────────────────────────── -->
<div id="welcome">
  <div class="welcome-avatar-wrap">
    <div class="welcome-avatar" id="welcome-avatar">🤖</div>
  </div>

  <div id="welcome-name" style="font-size:16px;font-weight:600;color:rgba(232,234,237,0.6);letter-spacing:.5px;min-height:22px;"></div>
  <h1 class="welcome-title" id="welcome-title">¿En qué puedo ayudarte?</h1>

  <div class="suggestions-grid" id="suggestions"></div>
</div>

<!-- ── Chat screen ────────────────────────────────── -->
<div id="chat-screen">
  <div id="chat-header">
    <div class="bot-chip">
      <div class="avatar" id="header-avatar">🤖</div>
      <span id="header-name">Bot</span>
    </div>
    <div class="online"><span></span> En línea</div>
  </div>
  <div id="messages"></div>
</div>

<!-- ── Input (always visible) ────────────────────── -->
<div id="input-container" class="welcome-mode">
  <div id="input-wrap">
    <textarea id="msg-input" placeholder="Pregunta lo que quieras..."
      rows="1"
      oninput="autoResize(this); toggleSend()"
      onkeydown="handleKey(event)"></textarea>
    <button id="send-btn" onclick="sendMessage()" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
  <div class="input-hint" id="input-hint">Powered by <strong>Zapien AI</strong></div>
</div>

<script>
  // ── CONFIG ────────────────────────────────────────────────────────────────
  const EMBED_KEY = 'EMBED_KEY_AQUI';
  const API_URL   = 'http://localhost:5001';
  // ─────────────────────────────────────────────────────────────────────────

  const visitorId = Math.random().toString(36).substring(2, 10);
  let convId = null, botId = null, accentColor = '#6366f1', isLoading = false, chatStarted = false;

  const SUGGESTIONS = [
    { icon: '📅', text: 'Quiero reservar una mesa para este fin de semana' },
    { icon: '🛵', text: 'Quiero hacer un pedido de delivery' },
    { icon: '🍽️', text: '¿Qué tienen en el menú? ¿Hay opciones vegetarianas?' },
    { icon: '📍', text: '¿Dónde están ubicados y a qué hora abren?' },
  ];

  // ── API ───────────────────────────────────────────────────────────────────
  async function api(method, path, body) {
    const r = await fetch(API_URL + path, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    return r.json();
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  async function init() {
    // Bot info
    try {
      const info = await api('GET', `/api/embed/bot-info?embedKey=${EMBED_KEY}`);
      if (info.success) applyBotInfo(info.data);
    } catch {}

    // Start conversation
    try {
      const res = await api('POST', '/api/embed/conversations', { embedKey: EMBED_KEY, visitorId });
      if (res.success) {
        convId = res.data.conversationId;
        botId  = res.data.botId;
        document.getElementById('msg-input').disabled = false;
        document.getElementById('msg-input').focus();
      }
    } catch {}

    // Build suggestions
    const grid = document.getElementById('suggestions');
    SUGGESTIONS.forEach(s => {
      const card = document.createElement('div');
      card.className = 'suggestion-card';
      card.innerHTML = `<span class="icon">${s.icon}</span><span class="text">${s.text}</span>`;
      card.onclick = () => sendText(s.text);
      grid.appendChild(card);
    });
  }

  function applyBotInfo(data) {
    accentColor = data.widget?.color || '#6366f1';
    const avatar = data.widget?.avatar || '🤖';
    const name   = data.name || 'Asistente';

    document.documentElement.style.setProperty('--accent', accentColor);

    // Welcome avatar with gradient border
    const wa = document.getElementById('welcome-avatar');
    wa.textContent = avatar;
    wa.style.background = accentColor + '22';
    wa.style.boxShadow  = `0 0 0 2px ${accentColor}`;

    // Bot name + title
    document.getElementById('welcome-name').textContent = name;
    document.getElementById('welcome-title').textContent = '¿En qué puedo ayudarte?';
    document.title = name;

    // Header
    const ha = document.getElementById('header-avatar');
    ha.textContent    = avatar;
    ha.style.background = accentColor + '33';
    document.getElementById('header-name').textContent = name;
  }

  // ── Transition welcome → chat ─────────────────────────────────────────────
  function startChat() {
    if (chatStarted) return;
    chatStarted = true;

    const welcome = document.getElementById('welcome');
    const chatScreen = document.getElementById('chat-screen');

    welcome.classList.add('hidden');

    setTimeout(() => {
      chatScreen.classList.add('visible');
      document.getElementById('input-hint').style.display = 'none';
    }, 200);
  }

  // ── Messaging ─────────────────────────────────────────────────────────────
  async function sendMessage() {
    const input = document.getElementById('msg-input');
    const text  = input.value.trim();
    if (!text || !convId || isLoading) return;

    startChat();

    input.value = '';
    input.style.height = 'auto';
    toggleSend();
    addMessage('user', text);
    showTyping();
    isLoading = true;

    try {
      const res = await api('POST', '/api/embed/messages', { conversationId: convId, content: text, botId });
      hideTyping();
      if (res.success) addMessage('bot', res.data.botMessage.content);
      else addMessage('bot', 'Error al procesar tu mensaje.');
    } catch {
      hideTyping();
      addMessage('bot', 'Error de conexión. Intenta de nuevo.');
    } finally {
      isLoading = false;
      input.focus();
    }
  }

  function sendText(text) {
    const input = document.getElementById('msg-input');
    input.value = text;
    toggleSend();
    sendMessage();
  }

  // ── DOM ───────────────────────────────────────────────────────────────────
  function addMessage(role, content) {
    const msgs = document.getElementById('messages');
    const row  = document.createElement('div');
    row.className = `msg-row ${role}`;

    if (role === 'bot') {
      const icon = document.createElement('div');
      icon.className = 'msg-icon';
      icon.textContent = document.getElementById('header-avatar').textContent || '🤖';
      icon.style.background = accentColor + '22';
      row.appendChild(icon);
    }

    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}`;
    bubble.textContent = content;
    row.appendChild(bubble);

    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  let typingEl = null;
  function showTyping() {
    const msgs = document.getElementById('messages');
    const row  = document.createElement('div');
    row.className = 'typing-row';

    const icon = document.createElement('div');
    icon.className = 'msg-icon';
    icon.textContent = document.getElementById('header-avatar').textContent || '🤖';
    icon.style.background = accentColor + '22';

    const dots = document.createElement('div');
    dots.className = 'typing-dots';
    dots.innerHTML = '<span></span><span></span><span></span>';

    row.appendChild(icon);
    row.appendChild(dots);
    typingEl = row;
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function hideTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  }

  function toggleSend() {
    const val = document.getElementById('msg-input').value.trim();
    const btn = document.getElementById('send-btn');
    btn.disabled = !val;
    btn.classList.toggle('active', !!val);
  }

  // ── Start ─────────────────────────────────────────────────────────────────
  document.getElementById('msg-input').disabled = true;
  init().then(() => {
    const input = document.getElementById('msg-input');
    if (!input.disabled) input.focus();
  });
</script>
</body>
</html>
