<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      width: 100%; height: 100%; overflow: hidden;
    }

    /* contenedor anclado abajo-derecha dentro del iframe */
    #wrap {
      position: fixed; bottom: 0; right: 0;
      display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
      padding: 0;
    }

    /* ---- BARRA MÍNIMA ---- */
    #bar {
      display: none; align-items: center; gap: 10px;
      background: #fff; border: 1px solid #e5e5e5; border-radius: 22px;
      padding: 8px 12px; max-width: 300px; cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      transition: opacity .18s ease;
    }
    #bar.show { display: flex; }
    #bar-icon { font-size: 16px; flex-shrink: 0; line-height: 1; }
    #bar-text {
      font-size: 12.5px; color: #555; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; flex: 1;
    }
    #bar-chevron { font-size: 13px; color: #aaa; flex-shrink: 0; }

    /* ---- BOTÓN MIC ---- */
    #mic-btn {
      width: 60px; height: 60px; border-radius: 50%; border: none;
      color: #fff; font-size: 26px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.22);
      transition: transform .15s ease;
      position: relative;
    }
    #mic-btn:hover { transform: scale(1.06); }
    #mic-btn.live::after {
      content: ''; position: absolute; inset: -4px; border-radius: 50%;
      border: 2px solid currentColor; opacity: .5;
      animation: pulse 1.6s ease-out infinite;
    }
    @keyframes pulse { 0% { transform: scale(1); opacity:.5 } 100% { transform: scale(1.35); opacity:0 } }

    /* ---- MODAL ---- */
    #modal {
      display: none; flex-direction: column;
      width: 360px; height: 540px;
      background: #fff; border: 1px solid #e5e5e5; border-radius: 16px;
      overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.20);
    }
    #modal.show { display: flex; }

    #m-head {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border-bottom: 1px solid #eee; flex-shrink: 0;
    }
    #m-avatar {
      width: 34px; height: 34px; border-radius: 50%; color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 17px;
    }
    #m-title { font-size: 13.5px; font-weight: 600; color: #1a1a1a; }
    #m-status { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #888; margin-top: 1px; }
    #m-status .dot { width: 6px; height: 6px; border-radius: 50%; background: #bbb; }
    #m-status.listening .dot { background: #2dbe60; }
    #m-status.thinking .dot { background: #f5a623; }
    #m-status.speaking .dot { background: #3a7afe; }
    #m-collapse { margin-left: auto; cursor: pointer; font-size: 18px; color: #aaa; background: none; border: none; }

    #m-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .turn { max-width: 80%; font-size: 13px; line-height: 1.5; padding: 8px 12px; border-radius: 14px; word-wrap: break-word; }
    .turn.user { align-self: flex-end; color: #fff; }
    .turn.bot  { align-self: flex-start; background: #f1f1f3; color: #1a1a1a; }
    .turn.partial { opacity: .65; }

    #m-foot { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 12px; border-top: 1px solid #eee; flex-shrink: 0; }
    .ctrl { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #e5e5e5; background: #f7f7f8; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #555; }
    .ctrl.active { background: #ffecec; border-color: #ffcaca; color: #d33; }
    .ctrl.hangup { background: #ffecec; border-color: #ffcaca; color: #d33; width: 52px; height: 52px; font-size: 22px; }

    #err { display: none; padding: 10px 12px; margin: 0 14px 12px; background: #fff4f4; color: #c0392b; font-size: 12px; border-radius: 8px; }
    #err.show { display: block; }
  </style>
</head>
<body>
  <div id="wrap">

    <div id="modal">
      <div id="m-head">
        <div id="m-avatar">🎙️</div>
        <div>
          <div id="m-title">Asistente</div>
          <div id="m-status"><span class="dot"></span><span id="m-status-text">Conectando…</span></div>
        </div>
        <button id="m-collapse" title="Minimizar">⌄</button>
      </div>
      <div id="err"></div>
      <div id="m-body"></div>
      <div id="m-foot">
        <button class="ctrl" id="mute-btn" title="Silenciar micrófono">🎤</button>
        <button class="ctrl hangup" id="hangup-btn" title="Colgar">⏹</button>
      </div>
    </div>

    <div id="bar">
      <span id="bar-icon">🔊</span>
      <span id="bar-text">Toca para hablar</span>
      <span id="bar-chevron">⌃</span>
    </div>

    <button id="mic-btn" title="Hablar con el asistente">🎤</button>

  </div>

  <audio id="remote-audio" autoplay></audio>

  <script>
    (function () {
      // ---- Config desde query params ----
      var qs       = new URLSearchParams(location.search);
      var embedKey = qs.get('embedKey') || '';
      var apiUrl   = (qs.get('apiUrl') || 'http://localhost:5001').replace(/\/$/, '');
      var color    = qs.get('color')  || '#534AB7';
      var avatar   = qs.get('avatar') || '🎙️';
      var name     = qs.get('name')   || 'Asistente';

      // ---- Elementos ----
      var wrap      = document.getElementById('wrap');
      var micBtn    = document.getElementById('mic-btn');
      var bar       = document.getElementById('bar');
      var barText   = document.getElementById('bar-text');
      var barIcon   = document.getElementById('bar-icon');
      var modal     = document.getElementById('modal');
      var mBody     = document.getElementById('m-body');
      var mTitle    = document.getElementById('m-title');
      var mAvatar   = document.getElementById('m-avatar');
      var mStatus   = document.getElementById('m-status');
      var mStatusTx = document.getElementById('m-status-text');
      var mCollapse = document.getElementById('m-collapse');
      var muteBtn   = document.getElementById('mute-btn');
      var hangupBtn = document.getElementById('hangup-btn');
      var errBox    = document.getElementById('err');
      var remoteAudio = document.getElementById('remote-audio');

      // aplicar marca
      micBtn.style.background = color;
      micBtn.style.color = '#fff';
      mAvatar.style.background = color;
      mAvatar.textContent = avatar;
      mTitle.textContent = name;

      // Logo opcional: si el bot tiene logo, reemplaza el emoji del avatar
      if (embedKey) {
        fetch(apiUrl + '/api/embed/bot-info?embedKey=' + embedKey)
          .then(function (r) { return r.json(); })
          .then(function (res) {
            if (res && res.success && res.data && res.data.logo) {
              mAvatar.innerHTML = '<img src="' + res.data.logo + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">';
            }
          })
          .catch(function () {});
      }

      // ---- Estado ----
      var pc = null, dc = null, localStream = null;
      var active = false, expanded = false, muted = false;
      var turns = [];                 // {role, text, el, done}
      var curBotTurn = null, curUserTurn = null;
      var conversationId = null;
      var visitorId = 'voice-' + Math.random().toString(36).slice(2, 11);
      var pendingCalls = {};          // call_id -> function name

      // ---- Tamaño del iframe: avisar al padre ----
      function setSize(state) {
        var size = { state: state, w: 88, h: 88 };
        if (state === 'bar')   size = { state: state, w: 320, h: 120 };
        if (state === 'modal') size = { state: state, w: 380, h: 560 };
        parent.postMessage({ type: 'voice-size', size: size }, '*');
      }

      function showState(s) {
        bar.classList.toggle('show', s === 'bar');
        modal.classList.toggle('show', s === 'modal');
        micBtn.style.display = (s === 'modal') ? 'none' : 'flex';
        setSize(s);
      }

      function setStatus(kind, text) {
        mStatus.className = '';
        mStatus.classList.add(kind);
        mStatusTx.textContent = text;
        if (kind === 'speaking') { barIcon.textContent = '🔊'; }
        else if (kind === 'listening') { barIcon.textContent = '🎙️'; }
        else { barIcon.textContent = '💬'; }
      }

      function setBar(text) { barText.textContent = text || '…'; }

      function showError(msg) {
        errBox.textContent = msg;
        errBox.classList.add('show');
      }

      // ---- Render de turnos ----
      function addTurn(role, text, partial) {
        var el = document.createElement('div');
        el.className = 'turn ' + (role === 'user' ? 'user' : 'bot') + (partial ? ' partial' : '');
        if (role === 'user') el.style.background = color;
        el.textContent = text || '';
        mBody.appendChild(el);
        mBody.scrollTop = mBody.scrollHeight;
        return { role: role, el: el, text: text || '' };
      }
      function updateTurn(turn, text, done) {
        if (!turn) return;
        turn.text = text;
        turn.el.textContent = text;
        if (done) turn.el.classList.remove('partial');
        mBody.scrollTop = mBody.scrollHeight;
        if (text) setBar(text);
      }

      // ---- WebRTC + Realtime ----
      async function startCall() {
        if (active) return;
        active = true;
        micBtn.classList.add('live');
        showState('bar');
        setStatus('thinking', 'Conectando…');
        setBar('Conectando…');

        var step = 'inicio';
        try {
          // 1) token efímero desde nuestro backend
          step = 'token';
          console.log('[voz] pidiendo token a', apiUrl + '/api/embed/realtime-token');
          var tokenResp;
          try {
            tokenResp = await fetch(apiUrl + '/api/embed/realtime-token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ embedKey: embedKey })
            });
          } catch (netErr) {
            throw new Error('No se pudo contactar el backend (' + apiUrl + '). ¿URL correcta / CORS?');
          }
          var tokenData = await tokenResp.json().catch(function () { return {}; });
          console.log('[voz] respuesta token:', tokenResp.status, tokenData);
          if (!tokenResp.ok || !tokenData.success || !tokenData.data || !tokenData.data.token) {
            throw new Error(tokenData.message || ('Backend respondió ' + tokenResp.status));
          }
          var EPHEMERAL = tokenData.data.token;
          var MODEL = tokenData.data.model || 'gpt-realtime';

          // 1b) crear conversación (para registrar transcripción y ejecutar acciones)
          step = 'conversacion';
          try {
            var convResp = await fetch(apiUrl + '/api/embed/conversations', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ embedKey: embedKey, visitorId: visitorId })
            });
            var convData = await convResp.json().catch(function () { return {}; });
            conversationId = convData?.data?.conversationId || null;
            console.log('[voz] conversación:', conversationId);
          } catch (convErr) {
            console.warn('[voz] no se pudo crear conversación (sigue sin registro):', convErr);
          }

          // 2) micrófono (gesto del usuario => permiso OK)
          step = 'microfono';
          try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          } catch (micErr) {
            throw new Error('Permiso de micrófono denegado o no disponible (requiere HTTPS)');
          }

          // 3) RTCPeerConnection
          step = 'webrtc';
          pc = new RTCPeerConnection();
          pc.ontrack = function (e) { remoteAudio.srcObject = e.streams[0]; };
          localStream.getTracks().forEach(function (t) { pc.addTrack(t, localStream); });

          // 4) canal de datos para eventos (transcripciones, estados)
          dc = pc.createDataChannel('oai-events');
          dc.addEventListener('message', onRealtimeEvent);

          // 5) SDP offer -> OpenAI -> answer
          step = 'openai';
          var offer = await pc.createOffer();
          await pc.setLocalDescription(offer);

          var sdpResp = await fetch('https://api.openai.com/v1/realtime/calls?model=' + encodeURIComponent(MODEL), {
            method: 'POST',
            body: offer.sdp,
            headers: { 'Authorization': 'Bearer ' + EPHEMERAL, 'Content-Type': 'application/sdp' }
          });
          if (!sdpResp.ok) {
            var sdpErr = await sdpResp.text().catch(function () { return ''; });
            console.error('[voz] OpenAI SDP error', sdpResp.status, sdpErr);
            throw new Error('OpenAI rechazó la conexión (' + sdpResp.status + ')');
          }
          var answer = { type: 'answer', sdp: await sdpResp.text() };
          await pc.setRemoteDescription(answer);

          setStatus('listening', 'Escuchando…');
          setBar('Escuchando…');
        } catch (err) {
          var detail = (err && err.message) ? err.message : 'Error desconocido';
          console.error('[voz] fallo en paso "' + step + '":', err);
          showError('[' + step + '] ' + detail);
          setStatus('thinking', 'Error');
          setBar(detail);
          expanded = true; showState('modal');   // abrir modal para ver el detalle
          stopCall(true);
        }
      }

      // enviar un evento al modelo por el data channel
      function sendEvent(obj) {
        try { if (dc && dc.readyState === 'open') dc.send(JSON.stringify(obj)); } catch (e) { console.warn('[voz] sendEvent', e); }
      }

      // registrar transcripción en el backend (no bloqueante)
      function logTranscript(role, text) {
        if (!conversationId || !text) return;
        fetch(apiUrl + '/api/embed/voice-transcript', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ conversationId: conversationId, role: role, content: text })
        }).catch(function () {});
      }

      // ejecutar una function-call en el backend y devolver el resultado al modelo
      async function handleFunctionCall(callId, fnName, argsStr) {
        var args = {};
        try { args = JSON.parse(argsStr || '{}'); } catch (_) {}
        setStatus('thinking', 'Procesando…');
        var output = 'No se pudo completar la acción.';
        try {
          var r = await fetch(apiUrl + '/api/embed/voice-tool', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ embedKey: embedKey, conversationId: conversationId, name: fnName, args: args })
          });
          var data = await r.json().catch(function () { return {}; });
          output = data.result || data.message || output;
          console.log('[voz] tool', fnName, '->', output);
        } catch (err) {
          console.error('[voz] error tool', fnName, err);
        }
        // devolver el resultado al modelo y pedir que continúe hablando
        sendEvent({ type: 'conversation.item.create', item: {
          type: 'function_call_output', call_id: callId, output: String(output)
        }});
        sendEvent({ type: 'response.create' });
      }

      function onRealtimeEvent(e) {
        var msg;
        try { msg = JSON.parse(e.data); } catch (_) { return; }
        switch (msg.type) {
          case 'input_audio_buffer.speech_started':
            setStatus('listening', 'Escuchando…');
            curUserTurn = addTurn('user', '…', true);
            break;
          case 'conversation.item.input_audio_transcription.completed':
            if (curUserTurn) { updateTurn(curUserTurn, msg.transcript || '', true); curUserTurn = null; }
            else if (msg.transcript) { addTurn('user', msg.transcript, false); }
            logTranscript('user', msg.transcript || '');
            break;
          case 'response.created':
            setStatus('thinking', 'Pensando…');
            curBotTurn = addTurn('bot', '…', true);
            break;
          case 'response.output_item.added':
            // registrar nombre de la función por call_id
            if (msg.item && msg.item.type === 'function_call') {
              pendingCalls[msg.item.call_id] = msg.item.name;
            }
            break;
          case 'response.audio_transcript.delta':
          case 'response.output_audio_transcript.delta':
            setStatus('speaking', 'Hablando…');
            if (!curBotTurn) curBotTurn = addTurn('bot', '', true);
            updateTurn(curBotTurn, (curBotTurn.text === '…' ? '' : curBotTurn.text) + (msg.delta || ''), false);
            break;
          case 'response.audio_transcript.done':
          case 'response.output_audio_transcript.done':
            if (curBotTurn) { updateTurn(curBotTurn, msg.transcript || curBotTurn.text, true); }
            logTranscript('assistant', (curBotTurn && curBotTurn.text) || msg.transcript || '');
            curBotTurn = null;
            break;
          case 'response.function_call_arguments.done':
            // el modelo pide ejecutar una acción
            var fnName = msg.name || pendingCalls[msg.call_id];
            if (fnName && msg.call_id) {
              handleFunctionCall(msg.call_id, fnName, msg.arguments);
              delete pendingCalls[msg.call_id];
            }
            break;
          case 'response.done':
            setStatus('listening', 'Escuchando…');
            break;
        }
      }

      function stopCall(silent) {
        active = false;
        micBtn.classList.remove('live');
        try { if (dc) dc.close(); } catch (_) {}
        try { if (pc) pc.close(); } catch (_) {}
        try { if (localStream) localStream.getTracks().forEach(function (t) { t.stop(); }); } catch (_) {}
        pc = null; dc = null; localStream = null;
        curBotTurn = null; curUserTurn = null;
        pendingCalls = {}; conversationId = null;
        if (!silent) { expanded = false; showState('idle'); }
      }

      // ---- Interacciones UI ----
      micBtn.addEventListener('click', function () {
        if (!active) { startCall(); }
        else { expanded = true; showState('modal'); }
      });
      bar.addEventListener('click', function () { expanded = true; showState('modal'); });
      mCollapse.addEventListener('click', function () { expanded = false; showState('bar'); });
      hangupBtn.addEventListener('click', function () { stopCall(false); });
      muteBtn.addEventListener('click', function () {
        muted = !muted;
        if (localStream) localStream.getAudioTracks().forEach(function (t) { t.enabled = !muted; });
        muteBtn.classList.toggle('active', muted);
        muteBtn.textContent = muted ? '🔇' : '🎤';
      });

      // ---- postMessage del padre (cerrar desde fuera) ----
      window.addEventListener('message', function (e) {
        if (!e.data || !e.data.type) return;
        if (e.data.type === 'voice-stop') { stopCall(false); }
      });

      // estado inicial + avisar listo
      showState('idle');
      parent.postMessage({ type: 'voice-ready' }, '*');
    })();
  </script>
</body>
</html>
